# ─────────────────────────────────────────────
# docker-compose.yml
# Volleyball Pre-Match Warm-Up Tracker
# ─────────────────────────────────────────────

services:
  volleyball-timer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volleyball-warm-up-timer
    ports:
      - "6789:80" # Access at http://localhost:6789
    environment:
      - ALLOWED_USERS=warmup
      - ADMIN_TOKEN=admin-secret
    restart: unless-stopped
    volumes: [] # Static files baked into image; no volumes needed
